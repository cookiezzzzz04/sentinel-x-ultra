[project]
name = "sentinel-x-ultra"
version = "0.1.0"
description = "Autonomous Security Analysis Intelligence Framework"
authors = [{name = "SENTINEL-X Team"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF",
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D213", "E501",
    "SIM108", "SIM105", "SIM115", "UP037",
    "E702", "E703",
    # Pre-existing — clean up gradually
    "F841", "B007", "RUF059", "SIM102", "RUF013", "E722", "B904",
    "C401", "C416", "SIM103", "SIM110", "SIM116", "SIM222",
    "N811", "N814", "B006", "RUF006", "RUF005",
    "RUF001", "RUF002", "RUF003", "RUF012", "B905",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # Re-exports
    "E402",  # Module-level imports after __all__
]
"server.py" = [
    "E402",  # Module-level imports after env setup
]
"fix_*.py" = [
    "F821", "F401", "E402",
]
"*burp_input_endpoints.py" = [
    "F821", "F401", "E402",
]
"*new_endpoints.py" = [
    "F821", "F401", "E402",
]
"*v3_endpoints.py" = [
    "F821",
]
"tests/*.py" = [
    "N802", "N803", "D400", "D415",
]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = [
    "sentinel_x_ultra/tests",
]
