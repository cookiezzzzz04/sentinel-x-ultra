# =============================================================================
# SENTINEL-X ULTRA — Docker Compose
# =============================================================================
# Start: docker compose up -d
# Stop:  docker compose down
# Logs:  docker compose logs -f
# =============================================================================

version: "3.8"

services:
  app:
    build: .
    container_name: sentinel-x-ultra
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      # Persist projects, config, and provider settings
      - sentinelx_data:/root/.sentinel-x
      # Optional: mount a folder to scan
      - ./workspace:/workspace:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sentinelx_data:
    name: sentinelx_data
