# =============================================================================
# SENTINEL-X ULTRA — Production Docker Compose
# =============================================================================
# Production-grade deployment with resource limits, log rotation, security,
# health checks, and monitoring.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Override with docker-compose.yml for local dev:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Cache for faster rebuilds (replace 'yourusername' with your GitHub username)
      cache_from:
        - ghcr.io/${GITHUB_REPOSITORY_OWNER:-yourusername}/sentinel-x-ultra:latest
    container_name: sentinel-x-ultra

    # ─── Networking ──────────────────────────────────────────────────────────
    ports:
      - "127.0.0.1:7860:7860"     # Bind to localhost only — use a reverse proxy for public access
    networks:
      - sentinelx_net

    # ─── Environment ─────────────────────────────────────────────────────────
    env_file:
      - .env
    environment:
      - SENTINELX_SERVER__HOST=0.0.0.0
      - SENTINELX_SERVER__PORT=7860
      - SENTINELX_SERVER__LOG_LEVEL=INFO

    # ─── Volumes ─────────────────────────────────────────────────────────────
    volumes:
      # Persist projects, config, and provider settings
      - sentinelx_data:/root/.sentinel-x
      # Mount a workspace folder for scanning (read-only for safety)
      - ./workspace:/workspace:ro

    # ─── Resource Limits ─────────────────────────────────────────────────────
    # Adjust these based on your server hardware
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    mem_limit: 4g
    memswap_limit: 8g     # Total = 4g RAM + 4g swap
    cpus: "2.0"
    pids_limit: 200

    # ─── Restart & Health ────────────────────────────────────────────────────
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    # ─── Logging ─────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    # ─── Security ────────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # Allow binding to privileged ports if needed
    read_only: false       # /root/.sentinel-x needs writes
    tmpfs:
      - /tmp:size=100M     # Temporary storage for cache, bounded to 100MB

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  sentinelx_net:
    name: sentinelx_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  sentinelx_data:
    name: sentinelx_data
    driver: local
